name: Build All Tags Sequentially

on:
  workflow_dispatch:
    inputs:
      start_tag:
        description: 'Start building from this tag (inclusive). Leave empty for all tags.'
        required: false
        type: string
      end_tag:
        version: 'End building at this tag (inclusive). Leave empty to build up to the oldest.'
        required: false
        type: string

permissions:
  contents: write

env:
  SOLUTION_FILE: Plain Craft Launcher 2.sln
  CONFIGURATION: Release

jobs:
  build-all-tags:
    name: Build ${{ matrix.tag }}
    runs-on: windows-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        tag:
          - '2.99.0.0'
          - '2.14.0.0'
          - '2.13.1.1'
          - '2.13.1.0'
          - '2.13.0.1'
          - '2.13.0.0'
          - '2.12.8.2'
          - '2.12.8.1'
          - '2.12.8.0'
          - '2.12.7.3'
          - '2.12.7.2'
          - '2.12.6.2'
          - '2.12.6.1'
          - '2.12.6'
          - '2.12.5'
          - '2.12.4'
          - '2.12.3'
          - '2.12.2'
          - '2.12.1'
          - '2.12.0'
          - '2.11.2'
          - '2.11.1'
          - '2.11.0'
          - '2.10.9'
          - '2.10.8'
          - '2.10.7'
          - '2.10.6'
          - '2.10.5'
          - '2.10.4'
          - '2.10.3'
          - '2.10.2'
          - '2.10.1'
          - '2.10.0'
          - '2.9.3'
          - '2.9.2'
          - '2.9.1'
          - '2.8.13'
          - '2.8.12'
          - '2.8.11'
          - '2.8.10'
          - '2.8.9'
          - '2.8.8'
          - '2.8.7'
          - '2.8.6'
          - '2.8.5'
          - '2.8.4'
          - '2.8.3'
          - '2.8.2'
          - '2.8.1'
          - '2.8.0'
          - '2.7.4'
          - '2.7.3'
          - '2.7.2'
          - '2.7.1'
          - '2.7.0'
          - '2.6.15'
          - '2.6.14'
          - '2.6.13'
          - '2.6.12'
          - '2.6.11'
          - '2.6.10'
          - '2.6.9'
          - '2.6.8'
          - '2.6.7'
          - '2.6.6'
          - '2.6.5'
          - '2.6.4'
          - '2.6.3'
          - '2.6.2'
          - '2.6.1'
          - '2.6.0'
          - '2.5.4'
          - '2.5.3'
          - '2.5.2'
          - '2.5.1'
          - '2.5.0'
          - '2.4.9'
          - '2.4.8'
          - '2.4.7'
          - '2.4.6'
          - '2.4.5'
          - '2.4.4'
          - '2.4.3'
          - '2.4.2'
          - '2.4.1'
          - '2.4.0'
          - '2.3.5'
          - '2.3.4'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tag }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore "${env:SOLUTION_FILE}"

      - name: Build project (${{ matrix.tag }})
        run: msbuild "${env:SOLUTION_FILE}" /p:Configuration=${env:CONFIGURATION} /p:Platform=x64

      - name: Package output
        shell: pwsh
        run: |
          $outdir = "Plain Craft Launcher 2/bin/x64/${{ env.CONFIGURATION }}"
          $dest = "PCL-${{ matrix.tag }}"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Path $dest | Out-Null
          Copy-Item "$outdir/*" $dest/ -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCL-${{ matrix.tag }}
          path: PCL-${{ matrix.tag }}/*.exe
          retention-days: 90
