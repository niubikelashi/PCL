# Workflow updated to test submodule fix
name: Build All Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name'
        required: true
        type: string
      build_all:
        description: 'Build all tags'
        required: false
        type: boolean
        default: false
