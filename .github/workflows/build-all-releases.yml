name: Build All Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to build (e.g. 2.14.0.0)'
        required: true
        type: string
      build_all:
        description: 'Build all tags (will take a long time)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  SOLUTION_FILE: Plain Craft Launcher 2.sln
  CONFIGURATION: Release

jobs:
  build-latest:
    name: Build Latest (main)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore ${env:SOLUTION_FILE}

      - name: Build project
        run: msbuild "${env:SOLUTION_FILE}" /p:Configuration=${env:CONFIGURATION}

      - name: Upload PCL executable and dependencies
        uses: actions/upload-artifact@v4
        with:
          name: PCL-Latest-Build
          path: |
            Plain Craft Launcher 2/bin/${{ env.CONFIGURATION }}/PCL.exe
            Plain Craft Launcher 2/bin/${{ env.CONFIGURATION }}/*.dll
          retention-days: 7

      - name: Create Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Plain Craft Launcher 2/bin/${{ env.CONFIGURATION }}/PCL.exe
            Plain Craft Launcher 2/bin/${{ env.CONFIGURATION }}/*.dll
          generate_release_notes: true
          name: PCL v${{ github.ref_name }}

  build-tags:
    name: Build Tag ${{ matrix.tag }}
    needs: build-latest
    if: github.event.inputs.build_all == 'true' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-latest
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        tag:
          - '2.14.0.0'
          - '2.13.1.1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tag }}
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore "${env:SOLUTION_FILE}"

      - name: Build project
        run: msbuild "${env:SOLUTION_FILE}" /p:Configuration=${env:CONFIGURATION}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCL-${{ matrix.tag }}
          path: |
            Plain Craft Launcher 2/bin/${{ env.CONFIGURATION }}/PCL.exe
            Plain Craft Launcher 2/bin/${{ env.CONFIGURATION }}/*.dll
          retention-days: 30
